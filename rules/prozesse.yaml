# Zuordnung der Prüfregeln zu Geschäftsprozessen.
#
# Diese Datei beantwortet die Frage, die im Kundentermin als erste kommt:
# "Welche Prozesse deckt ihr ab?" Sie ändert nichts an der Prüfung und geht
# deshalb - wie die Übersetzungen - nicht in den Inhaltshash des Katalogs ein.
#
# Eine Regel darf mehreren Prozessen zugeordnet sein. Das ist kein Schönheits-
# fehler, sondern der Sachverhalt: ein fehlendes Abstimmkonto blockiert den
# Zahllauf (Purchase-to-Pay) und bricht zugleich die Verbindung ins Hauptbuch
# (Record-to-Report).
#
# Zuordnung über drei Wege, die sich ergänzen:
#   bereiche:   alle Regeln dieser Objektbereiche
#   kategorien: alle Regeln dieser Kategorien
#   regeln:     einzelne Regel-IDs
#
# Jeder Prozess nennt außerdem seine Grenzen. Das ist der wichtigste Teil:
# wer im Termin sagen kann, was das Werkzeug *nicht* leistet, wird beim Rest
# geglaubt.

version: "1.0.0"

processes:

  # ============================================================ Kernprozesse
  - id: p2p
    name: Purchase-to-Pay
    gruppe: kern
    beschreibung: >
      Von der Lieferantenanlage bis zur Zahlung. Geprüft werden die
      Stammdaten, ohne die eine Bestellung nicht buchbar und ein Zahllauf
      nicht ausführbar ist.
    schritte:
      - Lieferantenanlage
      - Bestellung
      - Wareneingang
      - Rechnungsprüfung
      - Zahllauf
    schwerpunkte:
      - Voraussetzungen des Zahllaufs - IBAN nach ISO 13616, BIC, Zahlweg je Land, Bankland gegen IBAN
      - Buchbarkeit - Abstimmkonto vorhanden, im Buchungskreis angelegt und als Kreditorenkonto gekennzeichnet
      - Fälligkeit und Skonto - Zahlungsbedingung in Buchungskreis und Einkauf, widerspruchsfrei
      - Mehrfach angelegte Lieferanten über USt-IdNr., Bankverbindung und Namensähnlichkeit
      - Zahlungsumleitungsrisiken - kürzlich geänderte Bankdaten, fehlende Funktionstrennung, CpD mit fester Bankverbindung
    grenzen: >
      Bestellungen, Wareneingänge, Rechnungen und Zahlungen sind nicht im
      Umfang. Doppelte Rechnungen, Abweichungen im Drei-Wege-Abgleich und
      Bestellungen am Rahmenvertrag vorbei lassen sich damit nicht finden.
    bereiche: [vendor]
    regeln: [X-FMT-001, X-CONS-001, X-RISK-001, X-REF-001, X-CONS-002]

  - id: o2c
    name: Order-to-Cash
    gruppe: kern
    beschreibung: >
      Vom Kundenstammsatz bis zum Zahlungseingang. Im Mittelpunkt stehen die
      Angaben, an denen Steuerfreiheit, Fakturierbarkeit und Mahnwesen
      hängen.
    schritte:
      - Kundenanlage
      - Auftrag
      - Lieferung
      - Faktura
      - Zahlungseingang
      - Mahnwesen
    schwerpunkte:
      - Steuerfreiheit innergemeinschaftlicher Lieferungen - USt-IdNr. vorhanden, formal richtig, über VIES bestätigt
      - Fakturierbarkeit - Buchungskreis- und Vertriebsbereichsdaten vollständig, Verkaufsorganisation vorhanden
      - Fälligkeit und Altersstruktur - Zahlungsbedingung im Buchungskreis
      - Wirksamkeit von Sperren - Vertriebssperre gegen offenen Buchungskreis
      - Kundendubletten, die Zahlungshistorie und Kreditlimit auf mehrere Konten verteilen
    grenzen: >
      Aufträge, Lieferungen und Fakturen sind nicht im Umfang. Die
      Kreditausschöpfung gegen das Limit, die Umsatzverteilung und offene
      Posten lassen sich damit nicht bewerten - wohl aber der Umstand, dass
      ein Limit durch eine Dublette auf zwei Konten zerfällt.
    bereiche: [customer]

  - id: bestand
    name: Plan-to-Produce und Bestandsführung
    gruppe: kern
    beschreibung: >
      Vom Materialstammsatz über die Disposition bis zur Bestandsbewertung.
      Geprüft wird, ob ein Material überhaupt disponierbar, bewegbar und
      bewertbar ist.
    schritte:
      - Materialanlage
      - Disposition
      - Beschaffung oder Fertigung
      - Bestandsführung
      - Bewertung
    schwerpunkte:
      - Disponierbarkeit - Dispomerkmal, Werkssicht, Basismengeneinheit
      - Bewertbarkeit - Bewertungsklasse vorhanden und zur Materialart passend
      - Bestandswert - Standardpreissteuerung ohne Preis, Bestand ohne Preis, Wert gegen Menge mal Preis
      - Identifikation - Kurztext, EAN mit gültiger Prüfziffer
      - Doppelt angelegte Materialien, die Bestand und Bedarf zersplittern
    grenzen: >
      Warenbewegungen, Bestellungen und Fertigungsaufträge sind nicht im
      Umfang. "Seit langem unbewegt" stützt sich auf das Änderungsdatum im
      Stammsatz, nicht auf die letzte Bewegung - ein Material mit regem
      Umschlag, aber unverändertem Stammsatz erscheint darin als Kandidat
      für die Stilllegung.
    bereiche: [material]

  - id: r2r
    name: Record-to-Report
    gruppe: kern
    beschreibung: >
      Die Stellen, an denen Stammdaten unmittelbar in den Abschluss wirken.
      Ein falsch zugeordnetes Bestandskonto fällt nicht beim Buchen auf,
      sondern erst in der Bilanzanalyse.
    schritte:
      - Nebenbuch
      - Kontenfindung
      - Hauptbuch
      - Abschluss
    schwerpunkte:
      - Abstimmkonten - vorhanden, im Buchungskreis angelegt, richtige Kontoart
      - Kontenfindung im Materialstamm - Bewertungsklasse gegen Materialart über die Kontenkategorie-Referenz
      - Bestandsbewertung - Wert, Menge und Preis müssen züinander passen
      - Verwaiste Nebenbuchsätze ohne allgemeine Daten
    grenzen: >
      Buchungen, Belege und Salden sind nicht im Umfang. Das Werkzeug zeigt,
      wo die Kontenfindung falsch aufgesetzt ist - nicht, welcher Betrag
      dadurch auf dem falschen Konto gelandet ist.
    regeln:
      - VEN-COMP-006
      - VEN-REF-001
      - VEN-REF-002
      - VEN-CONS-001
      - CUS-COMP-004
      - CUS-REF-001
      - CUS-CONS-001
      - MAT-COMP-005
      - MAT-CONS-001
      - MAT-CONS-002
      - MAT-CONS-003
      - MAT-CONS-004
      - MAT-CONS-005
      - MAT-REF-005

  # ======================================================= Querschnittsthemen
  - id: steuer
    name: Steuer und Compliance
    gruppe: quer
    beschreibung: >
      Angaben, an denen steuerliche Pflichten und aufsichtsrechtliche
      Sorgfaltspflichten hängen - quer über Kreditoren und Debitoren.
    schwerpunkte:
      - USt-IdNr. - Vorhandensein, länderspezifischer Aufbau, Prüfziffer für DE, NL und IT
      - Qualifizierte Bestätigung über das VIES-Verfahren der Europäischen Kommission
      - Länderkennzeichen der USt-IdNr. gegen das Land des Partners
      - Kennzeichen "natürliche Person" - es steuert Quellensteuer und Meldepflichten
      - Ladungsfähige Anschrift statt reiner Postfachanschrift
    grenzen: >
      Steuerkennzeichen, Steuerfindung und Quellensteuerarten sind noch nicht
      belegt, obwohl die Tabellen T007A, T059P und T059Z in den Metadaten
      bereits beschrieben sind. Der Abgleich "natürliche Person ohne
      Quellensteuerkennzeichen" wäre als reine Regeldatei nachzuziehen.
    regeln:
      - VEN-COMP-001
      - VEN-COMP-004
      - VEN-FMT-001
      - VEN-CONS-005
      - VEN-CONS-007
      - VEN-RISK-002
      - VEN-EXT-001
      - CUS-COMP-001
      - CUS-FMT-001
      - CUS-CONS-004
      - CUS-RISK-001
      - CUS-EXT-001

  - id: iks
    name: Internes Kontrollsystem
    gruppe: quer
    beschreibung: >
      Konstellationen, die in der Abschlussprüfung regelmäßig zur
      Feststellung werden. Keine davon ist für sich genommen ein Nachweis -
      jede verlangt eine Klärung und deren Dokumentation.
    schwerpunkte:
      - Zahlungsumleitung - kürzlich geänderte Bankdaten, Bankverbindung eines Mitarbeiters
      - Funktionstrennung - derselbe Benutzer legt an und ändert Bankdaten
      - CpD-Konto mit fest hinterlegter Bankverbindung
      - Dieselbe Bankverbindung bei mehreren Partnern oder über Kreditor und Debitor hinweg
      - Zur Löschung vorgemerkte Kreditoren ohne Zahlsperre
    grenzen: >
      Die Auswertung stützt sich auf Stammdaten und Änderungsbelege. Ohne
      Zahllaufdaten lässt sich nicht sagen, ob eine auffällige Konstellation
      auch tatsächlich zu einer Zahlung geführt hat.
    kategorien: [risk]
    regeln: [VEN-DUP-002, X-RISK-001, VEN-RISK-006]

  - id: dubletten
    name: Dublettenmanagement
    gruppe: quer
    beschreibung: >
      Mehrfach angelegte Stammsätze über alle Bereiche. Unterschieden wird
      zwischen hartem Nachweis (gleiche USt-IdNr., gleiche Bankverbindung,
      gleiche EAN) und begründetem Verdacht aus dem unscharfen Namens- und
      Adressabgleich.
    schwerpunkte:
      - Harter Nachweis über USt-IdNr., Steuernummer, Bankverbindung und EAN
      - Unscharfer Abgleich nach Normalisierung von Umlauten, Rechtsformen und Straßenabkürzungen
      - Cluster statt Paarlisten - ein Befund je Gruppe, in einem Zug bereinigbar
      - Bereinigungspotenzial in Stammsätzen, wenn je Cluster einer führend wird
    grenzen: >
      Ein unscharfer Treffer ist ein Verdacht mit Score, kein Nachweis.
      Geblockt wird nach Land und Postleitzahl sowie nach Namensanfang; ein
      Partner, der unter völlig anderem Namen an anderer Anschrift in einem
      anderen Land angelegt wurde, wird nur über einen harten Schlüssel
      gefunden.
    kategorien: [duplicate]

  - id: lifecycle
    name: Stammdatenlebenszyklus
    gruppe: quer
    beschreibung: >
      Anlage, Sperre, Löschvormerkung, Archivierung. Der häufigste Befund
      ist die nie abgeschlossene Archivierung - sie belastet jede Auswertung
      und jede Dublettensuche.
    schwerpunkte:
      - Löschvormerkung gesetzt, Archivierungslauf nie ausgeführt
      - Vormerkung zentral gesetzt, im Buchungskreis oder Werk aber nicht - sie wirkt dann nicht
      - Dauerhafte Sperren als Zeichen beendeter Geschäftsbeziehungen
      - Fehlanlagen - kurz nach der Anlage wieder vorgemerkt
      - Material mit Löschvormerkung, aber weiterhin mit Bestand
    grenzen: >
      "Seit langem unverändert" stützt sich auf die Änderungshistorie
      (CDHDR/CDPOS) und auf das Änderungsdatum im Stammsatz. Eine Buchung
      ohne Stammdatenänderung bleibt unsichtbar; die Aussage ist ein
      Ersatzmaß, kein Bewegungsnachweis.
    kategorien: [lifecycle]
    regeln: [VEN-CONS-003, VEN-CONS-004, CUS-CONS-003, MAT-CONS-006, BP-CONS-003]

  - id: bp
    name: Business Partner (S/4HANA)
    gruppe: quer
    beschreibung: >
      Der zentrale Geschäftspartner, der in S/4HANA an die Stelle getrennter
      Kreditoren- und Debitorenstämme tritt. Geprüft wird die Konsistenz
      seiner Grunddaten und Rollen.
    schwerpunkte:
      - Identifizierbarkeit - Name je nach Partnertyp in den richtigen Feldern
      - Rollen - ohne Rolle ist der Partner in keinem Prozess verwendbar
      - Adresszuordnung über die zentrale Adressverwaltung
      - Gültigkeitszeiträume und Löschkennzeichen gegen aktive Rollen
    grenzen: >
      Der Abgleich zwischen Geschäftspartner und den abgeleiteten
      Kreditoren- und Debitorensichten (Customer/Vendor Integration) ist noch
      nicht belegt. Eine eigene Dublettenregel auf Geschäftspartnern gibt es
      ebenfalls noch nicht - Dubletten werden über die Rollensichten
      gefunden.
    bereiche: [business_partner]
