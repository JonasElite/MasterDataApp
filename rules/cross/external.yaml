# Externe Validierung (FA-408).
#
# Diese Regeln verlassen die lokale Verarbeitung und übertragen Daten an einen
# externen Dienst. Sie laufen ausschließlich, wenn beides vorliegt:
#
#   * rules.allow_external_validation ist in der Projektkonfiguration gesetzt,
#   * eine Netzwerkverbindung besteht.
#
# Ohne ausdrückliche Freigabe werden sie abgeschaltet und im Coverage-Report
# als entfallen ausgewiesen - nicht stillschweigend übergangen. Massgeblich
# ist DS-04: keine Übertragung von Kundendaten an externe Dienste ohne
# dokumentierte Freigabe. Die Freigabe ist vor dem Lauf mit dem Datenschutz
# abzustimmen (offener Punkt OP-04).
rules:

  - id: VEN-EXT-001
    name: USt-IdNr. des Kreditors ist laut VIES nicht gültig
    description: >
      Das Bestätigungsverfahren der Europäischen Kommission (VIES) prüft, ob
      eine USt-IdNr. zum Abfragezeitpunkt tatsächlich vergeben und gültig ist.
      Die Formatprüfung (VEN-FMT-001) kann das nicht leisten: eine formal
      richtige Nummer kann erloschen oder nie vergeben worden sein.

      Übertragen werden ausschließlich Länderkennzeichen und Nummer, keine
      Namen und keine Adressen. Ergebnisse werden zwischengespeichert, damit
      Wiederholungsläufe den Dienst nicht erneut belasten.
    category: external
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor
    external: true
    key_columns: [LIFNR]
    client_column: MANDT
    requires:
      tables: [LFA1]
      fields:
        LFA1: [MANDT, LIFNR, NAME1, LAND1, STCEG, LOEVM]
    params: {}
    remediation: >
      Gültige USt-IdNr. beim Kreditor anfordern. Bis dahin keine steuerfreien
      innergemeinschaftlichen Umsätze mit diesem Partner abrechnen.
    sql: |
      SELECT MANDT, LIFNR, NAME1, LAND1, STCEG,
             vies_check_reason(LAND1, STCEG) AS befund
      FROM LFA1
      WHERE STCEG IS NOT NULL
        AND trim(STCEG) <> ''
        AND COALESCE(LOEVM, '') <> 'X'
        AND vat_id_valid(LAND1, STCEG)
        AND NOT vies_check_valid(LAND1, STCEG)

  - id: CUS-EXT-001
    name: USt-IdNr. des Debitors ist laut VIES nicht gültig
    description: >
      Für steuerfreie innergemeinschaftliche Lieferungen ist die qualifizierte
      Bestätigung der USt-IdNr. des Empfängers Voraussetzung. Eine nicht
      bestätigte Nummer lässt die Steuerfreiheit entfallen - der Befund wiegt
      beim Debitor deshalb schwerer als beim Kreditor.

      Übertragen werden ausschließlich Länderkennzeichen und Nummer.
    category: external
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    external: true
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, STCEG, LOEVM]
    params: {}
    remediation: >
      Qualifizierte Bestätigung einholen und dokumentieren. Bis dahin keine
      steuerfreie innergemeinschaftliche Lieferung abrechnen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, STCEG,
             vies_check_reason(LAND1, STCEG) AS befund
      FROM KNA1
      WHERE STCEG IS NOT NULL
        AND trim(STCEG) <> ''
        AND COALESCE(LOEVM, '') <> 'X'
        AND vat_id_valid(LAND1, STCEG)
        AND NOT vies_check_valid(LAND1, STCEG)
