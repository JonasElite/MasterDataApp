# Regelwerk Debitor (FA-401 bis FA-407).
#
# Der Debitorenstamm ist spiegelbildlich zum Kreditorenstamm aufgebaut:
# allgemeine Daten (KNA1), Buchungskreisdaten (KNB1) und Vertriebsbereichsdaten
# (KNVV). Die fachlichen Schwerpunkte liegen anders - beim Debitor stehen
# Steuerfindung, Kreditlimit und Fakturierung im Vordergrund.
rules:

  # ------------------------------------------------------ Vollständigkeit
  - id: CUS-COMP-001
    name: Debitor ohne Umsatzsteuer-Identifikationsnummer
    description: >
      Für steuerfreie innergemeinschaftliche Lieferungen ist die USt-IdNr. des
      Empfängers zwingend. Fehlt sie, ist die Steuerfreiheit nicht nachweisbar
      und die Umsatzsteuer wird im Zweifel nacherhoben. Geprüft werden
      deshalb nur Kunden im übrigen Gemeinschaftsgebiet - für einen
      inländischen Kunden verlangt das Gesetz keine USt-IdNr.
    category: completeness
    severity: critical
    version: "1.1.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, STCEG, KTOKD, XCPDK, STKZN, LOEVM]
    params:
      eu_countries: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE,
                     IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
      # Das Inland gehoert nicht dazu. Eine USt-IdNr. ist die materielle
      # Voraussetzung der Steuerfreiheit innergemeinschaftlicher Lieferungen
      # (§ 6a UStG) - fuer einen inlaendischen Kunden verlangt sie niemand.
      # Solange DE mitzaehlte, entstand in einem ueberwiegend deutschen
      # Kundenstamm eine Flut kritischer Befunde ohne Rechtsgrund. Und weil
      # kritische Befunde die Punktzahl tragen, verschob das zugleich das
      # Lagebild.
      inland: [DE]
      excluded_account_groups: [CPD, CPDA]
    remediation: USt-IdNr. beim Kunden erfragen, pflegen und über VIES bestätigen lassen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, KTOKD, STCEG
      FROM KNA1
      WHERE LAND1 IN ${eu_countries}
        AND LAND1 NOT IN ${inland}
        AND COALESCE(KTOKD, '') NOT IN ${excluded_account_groups}
        AND COALESCE(XCPDK, '') <> 'X'
        AND COALESCE(STKZN, '') <> 'X'
        AND COALESCE(LOEVM, '') <> 'X'
        AND (STCEG IS NULL OR is_placeholder_text(STCEG))

  - id: CUS-COMP-002
    name: Debitor ohne Ort oder Postleitzahl
    description: >
      Ohne vollständige Anschrift ist weder die Rechnungsstellung noch die
      Steuerfindung über das Empfängerland verlässlich.
    category: completeness
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, ORT01, PSTLZ, LOEVM, XCPDK]
    params: {}
    remediation: Anschrift beim Kunden erfragen und pflegen.
    sql: |
      SELECT
          MANDT, KUNNR, NAME1, LAND1, ORT01, PSTLZ,
          concat_ws(', ',
              CASE WHEN ORT01 IS NULL OR is_placeholder_text(ORT01) THEN 'Ort fehlt' END,
              CASE WHEN PSTLZ IS NULL OR is_placeholder_text(PSTLZ) THEN 'Postleitzahl fehlt' END
          ) AS befund
      FROM KNA1
      WHERE COALESCE(LOEVM, '') <> 'X'
        AND COALESCE(XCPDK, '') <> 'X'
        AND (ORT01 IS NULL OR is_placeholder_text(ORT01)
             OR PSTLZ IS NULL OR is_placeholder_text(PSTLZ))

  - id: CUS-COMP-003
    name: Debitor ohne Buchungskreisdaten
    description: >
      Ein Debitor ohne Buchungskreissicht kann nicht fakturiert werden. Solche
      Sätze stammen meist aus abgebrochenen Anlagen.
    category: completeness
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1, KNB1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, KTOKD, ERDAT, LOEVM]
        KNB1: [KUNNR]
    params: {}
    remediation: Buchungskreissicht anlegen oder den Satz stilllegen.
    sql: |
      SELECT a.MANDT, a.KUNNR, a.NAME1, a.KTOKD, a.ERDAT
      FROM KNA1 a
      LEFT JOIN (SELECT DISTINCT KUNNR FROM KNB1) b ON a.KUNNR = b.KUNNR
      WHERE b.KUNNR IS NULL AND COALESCE(a.LOEVM, '') <> 'X'

  - id: CUS-COMP-004
    name: Buchungskreisdaten ohne Abstimmkonto
    description: >
      Ohne Abstimmkonto ist der Debitor nicht bebuchbar; die Forderung findet
      keinen Weg ins Hauptbuch.
    category: completeness
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNB1]
      fields:
        KNB1: [MANDT, KUNNR, BUKRS, AKONT, LOEVM]
    params: {}
    remediation: Abstimmkonto gemäß Kontenplan nachpflegen.
    sql: |
      SELECT MANDT, KUNNR, BUKRS, AKONT
      FROM KNB1
      WHERE COALESCE(LOEVM, '') <> 'X'
        AND (AKONT IS NULL OR is_placeholder_text(AKONT))

  - id: CUS-COMP-005
    name: Buchungskreisdaten ohne Zahlungsbedingung
    description: >
      Ohne Zahlungsbedingung ist die Fälligkeit der Forderung nicht bestimmt.
      Das verfälscht die Altersstrukturliste und die Liquiditätsplanung.
    category: completeness
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNB1]
      fields:
        KNB1: [MANDT, KUNNR, BUKRS, ZTERM, LOEVM]
    params: {}
    remediation: Vereinbarte Zahlungsbedingung hinterlegen.
    sql: |
      SELECT MANDT, KUNNR, BUKRS, ZTERM
      FROM KNB1
      WHERE COALESCE(LOEVM, '') <> 'X'
        AND (ZTERM IS NULL OR is_placeholder_text(ZTERM))

  # -------------------------------------------------------------- Format
  - id: CUS-FMT-001
    name: USt-IdNr. mit falschem Aufbau oder falscher Prüfziffer
    description: >
      Eine formal falsche USt-IdNr. des Empfängers lässt die Steuerfreiheit der
      innergemeinschaftlichen Lieferung entfallen. Der Befund wiegt beim Debitor
      deshalb schwerer als beim Kreditor.
    category: format
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, STCEG]
    params: {}
    remediation: Nummer beim Kunden erfragen, korrigieren und über VIES bestätigen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, STCEG, vat_id_reason(LAND1, STCEG) AS befund
      FROM KNA1
      WHERE STCEG IS NOT NULL
        AND NOT is_placeholder_text(STCEG)
        AND NOT vat_id_valid(LAND1, STCEG)

  - id: CUS-FMT-002
    name: Postleitzahl passt nicht zum Land
    description: >
      Beim Debitor beeinflusst die Anschrift die Steuerfindung. Eine
      Postleitzahl, die nicht zum Land passt, deutet auf eine falsche
      Landeszuordnung hin.
    category: format
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, PSTLZ]
    params: {}
    remediation: Postleitzahl und Land gegen die Originalanschrift abgleichen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, PSTLZ, postal_code_reason(LAND1, PSTLZ) AS befund
      FROM KNA1
      WHERE PSTLZ IS NOT NULL AND LAND1 IS NOT NULL
        AND postal_code_known(LAND1)
        AND NOT postal_code_valid(LAND1, PSTLZ)

  - id: CUS-FMT-003
    name: IBAN des Debitors ist ungültig
    description: >
      Die Bankverbindung des Debitors wird für das Lastschriftverfahren
      gebraucht. Eine falsche IBAN führt zur Rückgabe der Lastschrift mit
      Entgeltbelastung.
    category: format
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Bankverbindung des Debitors
    key_columns: [KUNNR, BANKS, BANKL, BANKN]
    client_column: MANDT
    requires:
      tables: [KNBK]
      fields:
        KNBK: [MANDT, KUNNR, BANKS, BANKL, BANKN, IBAN]
    params: {}
    remediation: IBAN anhand des SEPA-Mandats korrigieren.
    sql: |
      SELECT MANDT, KUNNR, BANKS, BANKL, BANKN, IBAN, iban_reason(IBAN) AS befund
      FROM KNBK
      WHERE IBAN IS NOT NULL AND trim(IBAN) <> '' AND NOT iban_valid(IBAN)

  # ------------------------------------------------------------ Konsistenz
  - id: CUS-CONS-001
    name: Buchungskreisdaten ohne allgemeine Daten
    description: >
      Ein KNB1-Satz ohne KNA1-Satz ist eine Inkonsistenz, die im laufenden System
      nicht entstehen kann, und deutet auf eine unvollständige Lieferung hin.
    category: consistency
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNA1, KNB1]
      fields:
        KNA1: [KUNNR]
        KNB1: [MANDT, KUNNR, BUKRS, AKONT]
    params: {}
    remediation: Lieferumfang prüfen; sonst Inkonsistenz im Quellsystem klären.
    sql: |
      SELECT b.MANDT, b.KUNNR, b.BUKRS, b.AKONT
      FROM KNB1 b
      LEFT JOIN KNA1 a ON b.KUNNR = a.KUNNR
      WHERE a.KUNNR IS NULL

  - id: CUS-CONS-002
    name: Vertriebsbereichsdaten ohne allgemeine Daten
    description: >
      Ein KNVV-Satz ohne KNA1-Satz kann im laufenden System nicht entstehen.
    category: consistency
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Vertriebsbereich
    key_columns: [KUNNR, VKORG, VTWEG, SPART]
    client_column: MANDT
    requires:
      tables: [KNA1, KNVV]
      fields:
        KNA1: [KUNNR]
        KNVV: [MANDT, KUNNR, VKORG, VTWEG, SPART]
    params: {}
    remediation: Lieferumfang prüfen; sonst Inkonsistenz im Quellsystem klären.
    sql: |
      SELECT v.MANDT, v.KUNNR, v.VKORG, v.VTWEG, v.SPART
      FROM KNVV v
      LEFT JOIN KNA1 a ON v.KUNNR = a.KUNNR
      WHERE a.KUNNR IS NULL

  - id: CUS-CONS-003
    name: Löschvormerkung zentral gesetzt, im Buchungskreis aber nicht
    description: >
      Der zentral vorgemerkte Debitor bleibt im Buchungskreis bebuchbar. Die
      Vormerkung erweckt einen falschen Eindruck von Stilllegung.
    category: consistency
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNA1, KNB1]
      fields:
        KNA1: [KUNNR, NAME1, LOEVM]
        KNB1: [MANDT, KUNNR, BUKRS, LOEVM]
    params: {}
    remediation: Löschvormerkung nachziehen oder zentral zurücknehmen.
    sql: |
      SELECT b.MANDT, b.KUNNR, a.NAME1, b.BUKRS,
             a.LOEVM AS loevm_zentral, b.LOEVM AS loevm_buchungskreis
      FROM KNB1 b
      JOIN KNA1 a ON b.KUNNR = a.KUNNR
      WHERE COALESCE(a.LOEVM, '') = 'X' AND COALESCE(b.LOEVM, '') <> 'X'

  - id: CUS-CONS-004
    name: Länderkennzeichen der USt-IdNr. weicht vom Land des Debitors ab
    description: >
      Weicht das Länderkennzeichen der USt-IdNr. vom Land des Debitors ab, ist
      die Steuerfindung nicht eindeutig. Bei Reihengeschäften kann das richtig
      sein, muss dann aber dokumentiert werden.
    category: consistency
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, STCEG]
    params: {}
    remediation: Steuerliche Würdigung dokumentieren oder die Angabe korrigieren.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, STCEG, vat_id_country(STCEG) AS ustid_land
      FROM KNA1
      WHERE STCEG IS NOT NULL AND LAND1 IS NOT NULL
        AND vat_id_country(STCEG) IS NOT NULL
        AND vat_id_country(STCEG) <> CASE WHEN LAND1 = 'GR' THEN 'EL' ELSE LAND1 END

  - id: CUS-CONS-005
    name: Vertriebssperre gesetzt, Buchungskreis aber offen
    description: >
      Ein im Vertrieb gesperrter Debitor ohne Buchungssperre kann weiterhin
      bebucht werden. Die Sperre wirkt dann nur gegen neue Aufträge, nicht gegen
      offene Vorgänge.
    category: consistency
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNA1, KNB1]
      fields:
        KNA1: [KUNNR, NAME1, AUFSD, LIFSD, FAKSD]
        KNB1: [MANDT, KUNNR, BUKRS, SPERR]
    params: {}
    remediation: Sperrenkonzept prüfen und die Sperren aufeinander abstimmen.
    sql: |
      SELECT b.MANDT, b.KUNNR, a.NAME1, b.BUKRS,
             a.AUFSD AS auftragssperre, a.LIFSD AS liefersperre,
             a.FAKSD AS fakturasperre, b.SPERR AS buchungssperre
      FROM KNB1 b
      JOIN KNA1 a ON b.KUNNR = a.KUNNR
      WHERE (COALESCE(a.AUFSD, '') <> '' OR COALESCE(a.LIFSD, '') <> ''
             OR COALESCE(a.FAKSD, '') <> '')
        AND COALESCE(b.SPERR, '') <> 'X'

  # ------------------------------------------------------ Referenzintegrität
  - id: CUS-REF-001
    name: Abstimmkonto existiert nicht im Buchungskreis
    description: >
      Das Abstimmkonto des Debitors muss als Sachkonto im Buchungskreis vorhanden
      sein, sonst scheitert jede Buchung.
    category: referential
    severity: critical
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNB1, SKB1]
      fields:
        KNB1: [MANDT, KUNNR, BUKRS, AKONT, LOEVM]
        SKB1: [BUKRS, SAKNR]
    params: {}
    remediation: Sachkonto anlegen oder das Abstimmkonto korrigieren.
    sql: |
      SELECT b.MANDT, b.KUNNR, b.BUKRS, b.AKONT
      FROM KNB1 b
      LEFT JOIN SKB1 s ON b.BUKRS = s.BUKRS AND b.AKONT = s.SAKNR
      WHERE b.AKONT IS NOT NULL AND COALESCE(b.LOEVM, '') <> 'X' AND s.SAKNR IS NULL

  - id: CUS-REF-002
    name: Zahlungsbedingung ist im Customizing nicht definiert
    description: >
      Ein Verweis auf eine nicht vorhandene Zahlungsbedingung macht die
      Fälligkeitsrechnung unmöglich.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Buchungskreis
    key_columns: [KUNNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [KNB1, T052]
      fields:
        KNB1: [MANDT, KUNNR, BUKRS, ZTERM, LOEVM]
        T052: [ZTERM]
    params: {}
    remediation: Zahlungsbedingung anlegen oder im Debitor ersetzen.
    sql: |
      SELECT b.MANDT, b.KUNNR, b.BUKRS, b.ZTERM
      FROM KNB1 b
      LEFT JOIN (SELECT DISTINCT ZTERM FROM T052) t ON b.ZTERM = t.ZTERM
      WHERE b.ZTERM IS NOT NULL AND COALESCE(b.LOEVM, '') <> 'X' AND t.ZTERM IS NULL

  - id: CUS-REF-003
    name: Kontengruppe ist im Customizing nicht definiert
    description: >
      Eine unbekannte Kontengruppe setzt die Feldauswahl und damit die
      Pflichtfeldprüfung des Systems außer Kraft.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1, T077D]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, KTOKD]
        T077D: [KTOKD]
    params: {}
    remediation: Kontengruppe prüfen und den Stammsatz zuordnen.
    sql: |
      SELECT a.MANDT, a.KUNNR, a.NAME1, a.KTOKD
      FROM KNA1 a
      LEFT JOIN (SELECT DISTINCT KTOKD FROM T077D) t ON a.KTOKD = t.KTOKD
      WHERE a.KTOKD IS NOT NULL AND t.KTOKD IS NULL

  - id: CUS-REF-004
    name: Länderschlüssel ist im Customizing nicht definiert
    description: >
      Ein unbekannter Länderschlüssel bricht die Steuerfindung und die
      Adressprüfung.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1, T005]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1]
        T005: [LAND1]
    params: {}
    remediation: Länderschlüssel gegen T005 korrigieren.
    sql: |
      SELECT a.MANDT, a.KUNNR, a.NAME1, a.LAND1
      FROM KNA1 a
      LEFT JOIN (SELECT DISTINCT LAND1 FROM T005) t ON a.LAND1 = t.LAND1
      WHERE a.LAND1 IS NOT NULL AND t.LAND1 IS NULL

  - id: CUS-REF-005
    name: Verkaufsorganisation existiert nicht
    description: >
      Vertriebsbereichsdaten zu einer nicht vorhandenen Verkaufsorganisation sind
      verwaist.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: customer
    object_type: Debitor je Vertriebsbereich
    key_columns: [KUNNR, VKORG, VTWEG, SPART]
    client_column: MANDT
    requires:
      tables: [KNVV, TVKO]
      fields:
        KNVV: [MANDT, KUNNR, VKORG, VTWEG, SPART]
        TVKO: [VKORG]
    params: {}
    remediation: Verwaiste Sätze bereinigen.
    sql: |
      SELECT v.MANDT, v.KUNNR, v.VKORG, v.VTWEG, v.SPART
      FROM KNVV v
      LEFT JOIN (SELECT DISTINCT VKORG FROM TVKO) t ON v.VKORG = t.VKORG
      WHERE t.VKORG IS NULL

  # ------------------------------------------------ Lifecycle und Risiko
  - id: CUS-LC-001
    name: Löschvormerkung gesetzt, Satz aber weiterhin im Bestand
    description: >
      Die Löschvormerkung ist der erste Schritt der Archivierung. Bleibt sie
      lange stehen, wurde nie archiviert.
    category: lifecycle
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, ERDAT, LOEVM]
    params:
      months_since_creation: 12
    remediation: Archivierungslauf anstoßen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, ERDAT,
             date_diff('month', ERDAT, current_date) AS monate_seit_anlage
      FROM KNA1
      WHERE COALESCE(LOEVM, '') = 'X'
        AND ERDAT IS NOT NULL
        AND date_diff('month', ERDAT, current_date) >= ${months_since_creation}

  - id: CUS-RISK-001
    name: Debitor mit reiner Postfachanschrift
    description: >
      Für die Rechnungsanschrift und für Sorgfaltspflichten reicht ein Postfach
      in aller Regel nicht aus.
    category: risk
    severity: medium
    version: "1.0.0"
    object_area: customer
    object_type: Debitor
    key_columns: [KUNNR]
    client_column: MANDT
    requires:
      tables: [KNA1]
      fields:
        KNA1: [MANDT, KUNNR, NAME1, LAND1, STRAS, PFACH, ORT01, LOEVM]
    params: {}
    remediation: Ladungsfähige Anschrift erfragen und pflegen.
    sql: |
      SELECT MANDT, KUNNR, NAME1, LAND1, STRAS, PFACH, ORT01
      FROM KNA1
      WHERE COALESCE(LOEVM, '') <> 'X'
        AND ((PFACH IS NOT NULL AND trim(PFACH) <> ''
              AND (STRAS IS NULL OR trim(STRAS) = '' OR is_placeholder_text(STRAS)))
             OR is_po_box(STRAS))
