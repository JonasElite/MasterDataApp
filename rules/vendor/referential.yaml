# Referenzintegritaet Kreditor (FA-404).
#
# Diese Regeln brauchen die Customizing-Tabellen aus Kapitel 8.2. Sie sind klein
# im Volumen und unkritisch in der Freigabe, schalten aber ueberproportional
# viele Pruefungen frei - genau das weist die Nachforderungsliste (FA-304) aus,
# wenn sie fehlen.
rules:

  - id: VEN-REF-001
    name: Abstimmkonto existiert nicht im Buchungskreis
    description: >
      Das im Kreditor gepflegte Abstimmkonto muss als Sachkonto im Buchungskreis
      angelegt sein. Fehlt es, scheitert jede Buchung auf diesen Kreditor.
    category: referential
    severity: critical
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Buchungskreis
    key_columns: [LIFNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [LFB1, SKB1]
      fields:
        LFB1: [MANDT, LIFNR, BUKRS, AKONT, LOEVM]
        SKB1: [BUKRS, SAKNR]
    params: {}
    remediation: Sachkonto anlegen oder das Abstimmkonto im Kreditor korrigieren.
    sql: |
      SELECT b.MANDT, b.LIFNR, b.BUKRS, b.AKONT
      FROM LFB1 b
      LEFT JOIN SKB1 s ON b.BUKRS = s.BUKRS AND b.AKONT = s.SAKNR
      WHERE b.AKONT IS NOT NULL
        AND COALESCE(b.LOEVM, '') <> 'X'
        AND s.SAKNR IS NULL

  - id: VEN-REF-002
    name: Abstimmkonto ist kein Abstimmkonto fuer Kreditoren
    description: >
      Ein Sachkonto wird ueber das Mitbuchungskennzeichen zum Abstimmkonto einer
      Kontoart. Steht dort nicht "K" fuer Kreditoren, ist die Zuordnung falsch,
      auch wenn das Konto existiert.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Buchungskreis
    key_columns: [LIFNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [LFB1, SKB1]
      fields:
        LFB1: [MANDT, LIFNR, BUKRS, AKONT, LOEVM]
        SKB1: [BUKRS, SAKNR, MITKZ]
    params:
      expected_account_type: "K"
    remediation: Abstimmkonto durch ein Kreditorenabstimmkonto ersetzen.
    sql: |
      SELECT b.MANDT, b.LIFNR, b.BUKRS, b.AKONT, s.MITKZ AS mitbuchungskennzeichen
      FROM LFB1 b
      JOIN SKB1 s ON b.BUKRS = s.BUKRS AND b.AKONT = s.SAKNR
      WHERE COALESCE(b.LOEVM, '') <> 'X'
        AND COALESCE(s.MITKZ, '') <> ${expected_account_type}

  - id: VEN-REF-003
    name: Zahlungsbedingung ist im Customizing nicht definiert
    description: >
      Verweist ein Kreditor auf eine Zahlungsbedingung, die in T052 fehlt, laesst
      sich das Faelligkeitsdatum nicht ermitteln. Solche Verweise entstehen, wenn
      Customizing zurueckgebaut wird, ohne die Stammdaten anzupassen.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Buchungskreis
    key_columns: [LIFNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [LFB1, T052]
      fields:
        LFB1: [MANDT, LIFNR, BUKRS, ZTERM, LOEVM]
        T052: [ZTERM]
    params: {}
    remediation: Zahlungsbedingung im Customizing anlegen oder im Kreditor ersetzen.
    sql: |
      SELECT b.MANDT, b.LIFNR, b.BUKRS, b.ZTERM
      FROM LFB1 b
      LEFT JOIN (SELECT DISTINCT ZTERM FROM T052) t ON b.ZTERM = t.ZTERM
      WHERE b.ZTERM IS NOT NULL
        AND COALESCE(b.LOEVM, '') <> 'X'
        AND t.ZTERM IS NULL

  - id: VEN-REF-004
    name: Zahlweg ist fuer das Land des Kreditors nicht definiert
    description: >
      Das Feld ZWELS enthaelt die zulaessigen Zahlwege als Zeichenkette, je Zeichen
      einen Zahlweg. Jeder davon muss in T042Z fuer das Land hinterlegt sein, sonst
      uebergeht ihn der Zahllauf stillschweigend.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Buchungskreis
    key_columns: [LIFNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [LFA1, LFB1, T042Z]
      fields:
        LFA1: [LIFNR, LAND1]
        LFB1: [MANDT, LIFNR, BUKRS, ZWELS, LOEVM]
        T042Z: [LAND1, ZLSCH]
    params: {}
    remediation: Zahlweg im Customizing ergaenzen oder aus dem Kreditor entfernen.
    sql: |
      WITH aufgeloest AS (
          SELECT b.MANDT, b.LIFNR, b.BUKRS, b.ZWELS, a.LAND1, z.zahlweg
          FROM LFB1 b
          JOIN LFA1 a ON b.LIFNR = a.LIFNR
          CROSS JOIN unnest(string_split(b.ZWELS, '')) AS z(zahlweg)
          WHERE b.ZWELS IS NOT NULL
            AND COALESCE(b.LOEVM, '') <> 'X'
            AND trim(z.zahlweg) <> ''
      )
      SELECT
          MANDT, LIFNR, BUKRS, LAND1, ZWELS,
          string_agg(DISTINCT zahlweg, ', ' ORDER BY zahlweg) AS unbekannte_zahlwege
      FROM aufgeloest a
      WHERE NOT EXISTS (
          SELECT 1 FROM T042Z t
          WHERE t.LAND1 = a.LAND1 AND t.ZLSCH = a.zahlweg
      )
      GROUP BY MANDT, LIFNR, BUKRS, LAND1, ZWELS

  - id: VEN-REF-005
    name: Kontengruppe ist im Customizing nicht definiert
    description: >
      Die Kontengruppe steuert Feldauswahl und Nummernkreis. Ein Verweis auf eine
      nicht existierende Kontengruppe macht jede Pflichtfeldpruefung des Systems
      wirkungslos.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor
    key_columns: [LIFNR]
    client_column: MANDT
    requires:
      tables: [LFA1, T077K]
      fields:
        LFA1: [MANDT, LIFNR, NAME1, KTOKK]
        T077K: [KTOKK]
    params: {}
    remediation: Kontengruppe im Customizing pruefen und den Stammsatz zuordnen.
    sql: |
      SELECT a.MANDT, a.LIFNR, a.NAME1, a.KTOKK
      FROM LFA1 a
      LEFT JOIN (SELECT DISTINCT KTOKK FROM T077K) t ON a.KTOKK = t.KTOKK
      WHERE a.KTOKK IS NOT NULL AND t.KTOKK IS NULL

  - id: VEN-REF-006
    name: Laenderschluessel ist im Customizing nicht definiert
    description: >
      Ein unbekannter Laenderschluessel bricht die Steuerfindung, die
      Adresspruefung und die Meldung zur Aussenwirtschaftsstatistik.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor
    key_columns: [LIFNR]
    client_column: MANDT
    requires:
      tables: [LFA1, T005]
      fields:
        LFA1: [MANDT, LIFNR, NAME1, LAND1]
        T005: [LAND1]
    params: {}
    remediation: Laenderschluessel gegen T005 korrigieren.
    sql: |
      SELECT a.MANDT, a.LIFNR, a.NAME1, a.LAND1
      FROM LFA1 a
      LEFT JOIN (SELECT DISTINCT LAND1 FROM T005) t ON a.LAND1 = t.LAND1
      WHERE a.LAND1 IS NOT NULL AND t.LAND1 IS NULL

  - id: VEN-REF-007
    name: Buchungskreis existiert nicht
    description: >
      Buchungskreisdaten zu einem Buchungskreis, den es nicht gibt, sind
      verwaiste Saetze. Sie entstehen typischerweise bei Umstrukturierungen.
    category: referential
    severity: critical
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Buchungskreis
    key_columns: [LIFNR, BUKRS]
    client_column: MANDT
    company_code_column: BUKRS
    requires:
      tables: [LFB1, T001]
      fields:
        LFB1: [MANDT, LIFNR, BUKRS, AKONT]
        T001: [BUKRS]
    params: {}
    remediation: Verwaiste Buchungskreissaetze bereinigen.
    sql: |
      SELECT b.MANDT, b.LIFNR, b.BUKRS, b.AKONT
      FROM LFB1 b
      LEFT JOIN (SELECT DISTINCT BUKRS FROM T001) t ON b.BUKRS = t.BUKRS
      WHERE t.BUKRS IS NULL

  - id: VEN-REF-008
    name: Bankverbindung verweist auf eine unbekannte Bank
    description: >
      Bankland und Bankschluessel muessen im Bankenstamm vorhanden sein. Fehlt der
      Eintrag, kann der Zahllauf die Bankdaten nicht aufloesen.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Bankverbindung des Kreditors
    key_columns: [LIFNR, BANKS, BANKL]
    client_column: MANDT
    requires:
      tables: [LFBK, BNKA]
      fields:
        LFBK: [MANDT, LIFNR, BANKS, BANKL, BANKN]
        BNKA: [BANKS, BANKL]
    params: {}
    remediation: Bank im Bankenstamm anlegen oder die Bankverbindung korrigieren.
    sql: |
      SELECT k.MANDT, k.LIFNR, k.BANKS, k.BANKL, k.BANKN
      FROM LFBK k
      LEFT JOIN BNKA b ON k.BANKS = b.BANKS AND k.BANKL = b.BANKL
      WHERE k.BANKL IS NOT NULL AND b.BANKL IS NULL

  - id: VEN-REF-009
    name: Einkaufsorganisation existiert nicht
    description: >
      Einkaufsorganisationsdaten zu einer nicht vorhandenen Einkaufsorganisation
      sind verwaist und stoeren die Auswertung des Lieferantenstamms.
    category: referential
    severity: high
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Einkaufsorganisation
    key_columns: [LIFNR, EKORG]
    client_column: MANDT
    requires:
      tables: [LFM1, T024E]
      fields:
        LFM1: [MANDT, LIFNR, EKORG, WAERS]
        T024E: [EKORG]
    params: {}
    remediation: Verwaiste Saetze bereinigen.
    sql: |
      SELECT m.MANDT, m.LIFNR, m.EKORG, m.WAERS
      FROM LFM1 m
      LEFT JOIN (SELECT DISTINCT EKORG FROM T024E) t ON m.EKORG = t.EKORG
      WHERE t.EKORG IS NULL

  - id: VEN-REF-010
    name: Bestellwaehrung ist kein gueltiger Waehrungsschluessel
    description: >
      Die in der Einkaufsorganisationssicht gepflegte Waehrung muss im
      Waehrungsverzeichnis vorhanden sein, sonst scheitert die Preisfindung.
    category: referential
    severity: medium
    version: "1.0.0"
    object_area: vendor
    object_type: Kreditor je Einkaufsorganisation
    key_columns: [LIFNR, EKORG]
    client_column: MANDT
    requires:
      tables: [LFM1, TCURC]
      fields:
        LFM1: [MANDT, LIFNR, EKORG, WAERS, LOEVM]
        TCURC: [WAERS]
    params: {}
    remediation: Waehrungsschluessel korrigieren.
    sql: |
      SELECT m.MANDT, m.LIFNR, m.EKORG, m.WAERS
      FROM LFM1 m
      LEFT JOIN (SELECT DISTINCT WAERS FROM TCURC) t ON m.WAERS = t.WAERS
      WHERE m.WAERS IS NOT NULL
        AND COALESCE(m.LOEVM, '') <> 'X'
        AND t.WAERS IS NULL
