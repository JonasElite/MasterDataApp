# Metadaten der unterstützten SAP-Tabellen (DDIC-Auszug).
#
# Diese Datei ist Daten, kein Code: neue Tabellen und Felder werden hier
# gepflegt, ohne den Anwendungskern zu ändern (NFA-08). Ein Projekt kann die
# Angaben über `sap_tables_overlay` in der Projektkonfiguration ergänzen
# oder übersteuern.
#
# Feldangaben (alle optional, Standard ist ein Zeichenfeld ohne Konvertierung):
#   type    : char | numc | dats | tims | curr | quan | dec | int | flag | lang
#   alpha   : Feldlänge -> ALPHA-Konvertierung, führende Nullen werden
#             wiederhergestellt (FA-103)
#   aliases : beschreibende Spaltenüberschriften aus SE16N/Excel (FA-105)
#   pii     : Feld mit Personenbezug -> Pseudonymisierung (DS-05), Redaction
#
# tier: must | should | could  -> Datenanforderung an den Kunden (Kapitel 8)

MANDT_ALIASES: &mandt_aliases [Mandant, Client, "Mandantennummer"]

# Feldlängen laut DDIC. Sie werden gebraucht, um abgeschnittene Feldinhalte
# zu erkennen (FA-202) und um Werte zu melden, die nicht ins Zielfeld passen.
# Die Angabe gilt global für den Feldnamen; abweichende Längen stehen als
# "length" direkt am Feld der jeweiligen Tabelle (etwa ADRC-NAME1 mit 40).
